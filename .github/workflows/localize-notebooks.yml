name: Validate Chinese notebooks

on:
  push:
    branches:
      - docs/chinese-localization
  pull_request:
    paths:
      - '*.ipynb'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate notebooks
        run: python tools/translate_notebooks_zh.py
