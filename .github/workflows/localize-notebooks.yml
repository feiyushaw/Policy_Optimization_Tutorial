name: Validate Chinese notebooks

on:
  push:
    branches:
      - docs/chinese-localization
  pull_request:
    paths:
      - '*.ipynb'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate notebook JSON and Japanese residue
        run: |
          python - <<'PY'
          import json, pathlib, re
          jp = re.compile(r'[\u3040-\u30ff]')
          failed = []
          for p in pathlib.Path('.').glob('*.ipynb'):
              data = json.loads(p.read_text(encoding='utf-8'))
              text = json.dumps(data, ensure_ascii=False)
              if jp.search(text):
                  failed.append(str(p))
              print('OK JSON:', p)
          if failed:
              raise SystemExit('Japanese residue: ' + ', '.join(failed))
          print('All notebooks parse and no hiragana/katakana remains.')
          PY
